<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Instituto San Martín</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            width: 360px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #212529;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

            button:hover {
                background-color: #0b5ed7;
            }

        .hint {
            margin-top: 18px;
            font-size: 12px;
            color: #6c757d;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            text-align: left;
        }

        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Instituto "San Martín"</h2>
        <p style="color:#666; font-size:14px;">Acceso al Sistema de Gestión Escolar</p>

        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Usuario (ej: admin)" required>
            <input type="password" id="password" placeholder="Contraseña (ej: 1234)" required>
            <button type="submit">Ingresar</button>
            <div id="mensajeError" class="error"></div>
        </form>

        <div class="hint">
            <b>Usuarios habilitados (Clave: 1234):</b><br>
            • <b>admin</b> (Acceso total)<br>
            • <b>secretaria</b> (Personal Administrativo)<br>
            • <b>secretario</b> (Secretario General)<br>
            • <b>direccion</b> (Dirección Escolar)
        </div>
    </div>

    <script>
                document.getElementById('loginForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const errDiv = document.getElementById('mensajeError');
                    errDiv.style.display = 'none';

                    const body = {
                        usuario: document.getElementById('usuario').value,
                        password: document.getElementById('password').value
                    };

                    try {
                        const res = await fetch('/api/Auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });

                        const data = await res.json();
                        if (res.ok) {
                            localStorage.setItem('tokenJWT', data.token);
                            localStorage.setItem('usuarioNombre', data.nombre);
                            localStorage.setItem('usuarioRol', data.rol);
                            window.location.href = 'menu.html';
                        } else {
                            errDiv.innerText = data.mensaje || 'Credenciales inválidas.';
                            errDiv.style.display = 'block';
                        }
                    } catch (err) {
                        errDiv.innerText = 'Error al conectar con el servidor.';
                        errDiv.style.display = 'block';
                    }
                });
    </script>
</body>
</html>
