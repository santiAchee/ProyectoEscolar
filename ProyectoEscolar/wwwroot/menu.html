<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Instituto San Martín</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            padding: 25px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s;
            display: block;
        }

            .card:hover {
                transform: translateY(-4px);
            }

        .bg-blue {
            background-color: #0d6efd;
        }

        .bg-green {
            background-color: #198754;
        }

        .bg-purple {
            background-color: #6f42c1;
        }

        .bg-orange {
            background-color: #fd7e14;
        }

        .bg-teal {
            background-color: #20c997;
            grid-column: 1 / -1;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Instituto Educativo "San Martín"</h1>
        <p style="color: #666;">Sistema de Gestión de Inscripciones, Cupos y Padrón Escolar</p>

        <div class="grid">
            <a href="inscripciones.html" class="card bg-teal">
                📌 Gestión de Inscripciones, Cupos, Lista de Espera y Documentación
            </a>
            <a href="alumnos.html" class="card bg-blue">👨‍🎓 ABM Alumnos</a>
            <a href="tutores.html" class="card bg-purple">👪 ABM Tutores</a>
            <a href="docentes.html" class="card bg-green">👩‍🏫 ABM Docentes</a>
            <a href="cursos.html" class="card bg-orange">🏫 ABM Cursos y Turnos</a>
        </div>
    </div>
</body>
</html>
