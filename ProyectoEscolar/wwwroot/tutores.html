<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tutores - Sistema Escolar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #fd7e14;
            color: white;
        }

        input, select {
            padding: 10px;
            margin: 5px 5px 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 220px;
        }

        button {
            padding: 10px 15px;
            background-color: #fd7e14;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background-color: #e36b0d;
            }

        .btn-secondary {
            background-color: #6c757d;
        }

            .btn-secondary:hover {
                background-color: #5c636a;
            }

        .btn-danger {
            background-color: #dc3545;
        }

            .btn-danger:hover {
                background-color: #bb2d3b;
            }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-flex">
            <h2>Panel de Tutores</h2>
            <div>
                <button onclick="location.href='menu.html'" class="btn-secondary">Volver al Menú</button>
                <button onclick="cerrarSesion()" class="btn-danger">Cerrar Sesión</button>
            </div>
        </div>
        <hr>

        <h3>Registrar Nuevo Tutor</h3>
        <form id="tutorForm">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="text" id="apellido" placeholder="Apellido" required>
            <input type="text" id="dni" placeholder="DNI" required>
            <input type="text" id="telefono" placeholder="Teléfono">
            <input type="email" id="email" placeholder="Email">
            <select id="tipo" required>
                <option value="">Seleccione Tipo</option>
                <option value="Padre">Padre</option>
                <option value="Madre">Madre</option>
                <option value="Tutor Legal">Tutor Legal</option>
            </select>
            <button type="submit">Guardar</button>
        </form>

        <h3 style="margin-top: 30px;">Lista de Tutores</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>DNI</th>
                    <th>Tipo</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaTutores"></tbody>
        </table>
    </div>

    <script>
                const token = localStorage.getItem('tokenJWT');
                if (!token) window.location.href = 'login.html';

                async function cargarTutores() {
                    try {
                        const res = await fetch('/api/Tutores', { headers: { 'Authorization': `Bearer ${token}` } });
                        if (res.ok) {
                            const tutores = await res.json();
                            const tbody = document.getElementById('tablaTutores');
                            tbody.innerHTML = '';
                            tutores.forEach(t => {
                                const id = t.idTutor || t.IdTutor;
                                tbody.innerHTML += `
                                    <tr>
                                        <td>${id}</td>
                                        <td>${t.nombre || t.Nombre}</td>
                                        <td>${t.apellido || t.Apellido}</td>
                                        <td>${t.dni || t.Dni}</td>
                                        <td>${t.tipo || t.Tipo}</td>
                                        <td>${t.telefono || t.Telefono || '-'}</td>
                                        <td><button class="btn-danger" onclick="eliminarTutor(${id})">Eliminar</button></td>
                                    </tr>
                                `;
                            });
                        }
                    } catch (err) { console.error('Error al cargar tutores', err); }
                }

                document.getElementById('tutorForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const nuevo = {
                        nombre: document.getElementById('nombre').value,
                        apellido: document.getElementById('apellido').value,
                        dni: document.getElementById('dni').value,
                        telefono: document.getElementById('telefono').value,
                        email: document.getElementById('email').value,
                        tipo: document.getElementById('tipo').value
                    };

                    const res = await fetch('/api/Tutores', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify(nuevo)
                    });

                    if (res.ok) {
                        document.getElementById('tutorForm').reset();
                        cargarTutores();
                    } else { alert('Error al registrar tutor.'); }
                });

                async function eliminarTutor(id) {
                    if (confirm('¿Dar de baja este tutor?')) {
                        const res = await fetch(`/api/Tutores/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                        if (res.ok) cargarTutores();
                        else alert('No se pudo eliminar el tutor.');
                    }
                }

                function cerrarSesion() { localStorage.removeItem('tokenJWT'); window.location.href = 'login.html'; }

                cargarTutores();
    </script>
</body>
</html>
