<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alumnos - Sistema Escolar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 980px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #0d6efd;
            color: white;
        }

        input, select {
            padding: 10px;
            margin: 5px 5px 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 200px;
        }

        button {
            padding: 10px 15px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background-color: #0b5ed7;
            }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-teal {
            background-color: #198754;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-flex">
            <h2>Panel de Alumnos</h2>
            <div>
                <button onclick="location.href='inscripciones.html'" class="btn-teal">Asignar Curso / Inscripciones</button>
                <button onclick="location.href='menu.html'" class="btn-secondary">Volver al Menú</button>
            </div>
        </div>
        <hr>

        <h3>Registrar Nuevo Alumno</h3>
        <form id="alumnoForm">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="text" id="apellido" placeholder="Apellido" required>
            <input type="text" id="dni" placeholder="DNI" required>
            <input type="date" id="fechaNacimiento" required>
            <input type="text" id="direccion" placeholder="Dirección">
            <input type="text" id="telefono" placeholder="Teléfono">
            <select id="idTutor" required>
                <option value="">Seleccione un Tutor...</option>
            </select>
            <button type="submit">Guardar Alumno</button>
        </form>

        <h3 style="margin-top: 30px;">Lista de Alumnos Activos</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>DNI</th>
                    <th>Nacimiento</th>
                    <th>ID Tutor</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaAlumnos"></tbody>
        </table>
    </div>

    <script>
                async function cargarTutores() {
                    const res = await fetch('/api/Tutores');
                    if (res.ok) {
                        const tutores = await res.json();
                        const sel = document.getElementById('idTutor');
                        sel.innerHTML = '<option value="">Seleccione un Tutor...</option>';
                        tutores.forEach(t => {
                            sel.innerHTML += `<option value="${t.idTutor}">${t.apellido}, ${t.nombre} (${t.tipo} - DNI: ${t.dni})</option>`;
                        });
                    }
                }

                async function cargarAlumnos() {
                    const res = await fetch('/api/Alumnos');
                    if (res.ok) {
                        const alumnos = await res.json();
                        const tbody = document.getElementById('tablaAlumnos');
                        tbody.innerHTML = '';
                        alumnos.forEach(a => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${a.idAlumno}</td>
                                    <td>${a.nombre}</td>
                                    <td>${a.apellido}</td>
                                    <td>${a.dni}</td>
                                    <td>${a.fechaNacimiento}</td>
                                    <td>${a.idTutor || '-'}</td>
                                    <td>
                                        <button class="btn-teal" onclick="location.href='inscripciones.html'">Inscribir a Curso</button>
                                        <button class="btn-danger" onclick="eliminarAlumno(${a.idAlumno})">Dar de Baja</button>
                                    </td>
                                </tr>
                            `;
                        });
                    }
                }

                document.getElementById('alumnoForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const nuevo = {
                        nombre: document.getElementById('nombre').value,
                        apellido: document.getElementById('apellido').value,
                        dni: document.getElementById('dni').value,
                        fechaNacimiento: document.getElementById('fechaNacimiento').value,
                        direccion: document.getElementById('direccion').value,
                        telefono: document.getElementById('telefono').value,
                        idTutor: parseInt(document.getElementById('idTutor').value),
                        activo: true
                    };

                    const res = await fetch('/api/Alumnos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(nuevo)
                    });

                    if (res.ok) {
                        document.getElementById('alumnoForm').reset();
                        cargarAlumnos();
                    } else {
                        const err = await res.json();
                        alert('Error: ' + (err.mensaje || 'No se pudo registrar el alumno.'));
                    }
                });

                async function eliminarAlumno(id) {
                    if (confirm('¿Dar de baja este alumno?')) {
                        const res = await fetch(`/api/Alumnos/${id}`, { method: 'DELETE' });
                        if (res.ok) cargarAlumnos();
                    }
                }

                cargarTutores();
                cargarAlumnos();
    </script>
</body>
</html>
